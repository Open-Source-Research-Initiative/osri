nt-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >x = center</text><text x="1150" y="1082" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >diamond width</text><text x="1150" y="1134" fill="#29485D" font-family="OSRIInter" font-size="22" font-weight="400" text-anchor="start" >Clear space ≥ x.</text><text x="1150" y="1168" fill="#29485D" font-family="OSRIInter" font-size="22" font-weight="400" text-anchor="start" >Keep facets fixed.</text><path d="M64 1250 L1536 1250" fill="none" stroke="#C5D3CE" stroke-width="1.5" /><text x="64" y="1304" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >ICON AND PLACEMENT RULES</text><g fill="none" stroke="#102D48" stroke-width="2.2" stroke-linejoin="round"><path d="M68 1350 H112 V1386 H68 Z M80 1362 H100 M80 1373 H96"/><path d="M280 1369 H326 M312 1355 L326 1369 L312 1383"/><path d="M511 1368 L523 1380 L547 1354"/></g><text x="64" y="1439" fill="#29485D" font-family="OSRIInter" font-size="24" font-weight="400" text-anchor="start" >24 px grid; 1.5–2 px navy stroke. Examples shown at 2×; label essential icons.</text><text x="64" y="1483" fill="#29485D" font-family="OSRIInter" font-size="24" font-weight="400" text-anchor="start" >Align marks to the reading edge; use the open diamond as the clear-space unit.</text><text x="64" y="1527" fill="#29485D" font-family="OSRIInter" font-size="24" font-weight="400" text-anchor="start" >Arabic: Noto Sans Arabic. Preserve mark geometry; adapt reading order.</text><path d="M64 1596 L1536 1596" fill="none" stroke="#C5D3CE" stroke-width="1.5" /><text x="64" y="1630" fill="#29485D" font-family="OSRIPlexMono" font-size="17" font-weight="400" text-anchor="start" >Study scope: GitHub, research diagrams, and eight draft language specimens. See provenance and limits.</text></svg>