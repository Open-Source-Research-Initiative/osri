<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc"><title id="title">Prism multilingual and RTL specimens</title><desc id="desc">English, French, Spanish, and genuine right-to-left Arabic with isolated Latin OSRI. All translations are draft specimens requiring human language review.</desc><style>@font-face{font-family:OSRIInter;src:url('../fonts/Inter-Regular.ttf') format('truetype');font-weight:400}@font-face{font-family:OSRIInter;src:url('../fonts/Inter-Bold.ttf') format('truetype');font-weight:700}@font-face{font-family:OSRIPlexMono;src:url('../fonts/IBMPlexMono-Regular.ttf') format('truetype');font-weight:400}@font-face{font-family:OSRIArabic;src:url('../fonts/NotoSansArabic-Regular.ttf') format('truetype');font-weight:400}@font-face{font-family:OSRIArabic;src:url('../fonts/NotoSansArabic-Bold.ttf') format('truetype');font-weight:700}text{font-kerning:normal}</style><rect x="0" y="0" width="1600" height="1600" rx="0" fill="#FAF9F3"/><g transform="translate(64 51) scale(0.58)"><polygon points="39,0 75,21 41,44 5,22" fill="#7083DC"/><polygon points="5,22 41,44 5,66" fill="#6BC9AB"/><polygon points="5,66 41,44 41,86" fill="#E98879"/><polygon points="41,86 41,44 77,65" fill="#E5B84E"/><polygon points="77,65 41,44 75,21" fill="#47B9B5"/><polygon points="41,34 51,44 41,54 31,44" fill="#FAF9F3"/></g><text x="127" y="82" fill="#102D48" font-family="OSRIInter" font-size="30" font-weight="700" text-anchor="start" >OSRI</text><text x="1300" y="82" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >08 / PRISM</text><path d="M64 120 L1536 120" fill="none" stroke="#C5D3CE" stroke-width="1.5" /><text x="64" y="190" fill="#102D48" font-family="OSRIInter" font-size="48" font-weight="700" text-anchor="start" >A stable mark, more than one language</text><text x="64" y="249" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >DRAFT TRANSLATION SPECIMENS / HUMAN LANGUAGE REVIEW REQUIRED</text><g transform="translate(64 292) scale(0.9)"><polygon points="39,0 75,21 41,44 5,22" fill="#7083DC"/><polygon points="5,22 41,44 5,66" fill="#6BC9AB"/><polygon points="5,66 41,44 41,86" fill="#E98879"/><polygon points="41,86 41,44 77,65" fill="#E5B84E"/><polygon points="77,65 41,44 75,21" fill="#47B9B5"/><polygon points="41,34 51,44 41,54 31,44" fill="#FAF9F3"/></g><text x="180" y="322" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >ENGLISH / LATIN</text><text x="180" y="393" fill="#102D48" font-family="OSRIInter" font-size="43" font-weight="700" text-anchor="start" >Research across disciplines,</text><text x="180" y="448" fill="#102D48" font-family="OSRIInter" font-size="43" font-weight="700" text-anchor="start" >with an open and traceable record</text><text x="180" y="505" fill="#29485D" font-family="OSRIPlexMono" font-size="20" font-weight="400" text-anchor="start" >Start researching  /  Contribute  /  Get help</text><path d="M64 548 L1536 548" fill="none" stroke="#C5D3CE" stroke-width="1.5" /><g transform="translate(64 586) scale(0.9)"><polygon points="39,0 75,21 41,44 5,22" fill="#7083DC"/><polygon points="5,22 41,44 5,66" fill="#6BC9AB"/><polygon points="5,66 41,44 41,86" fill="#E98879"/><polygon points="41,86 41,44 77,65" fill="#E5B84E"/><polygon points="77,65 41,44 75,21" fill="#47B9B5"/><polygon points="41,34 51,44 41,54 31,44" fill="#FAF9F3"/></g><text x="180" y="617" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >FRANÇAIS / LATIN</text><text x="180" y="689" fill="#102D48" font-family="OSRIInter" font-size="43" font-weight="700" text-anchor="start" >Une recherche ouverte et traçable</text><text x="180" y="744" fill="#102D48" font-family="OSRIInter" font-size="43" font-weight="700" text-anchor="start" >pour relier les questions entre disciplines</text><text x="180" y="800" fill="#29485D" font-family="OSRIInter" font-size="25" font-weight="400" text-anchor="start" >Commencer une recherche  /  Contribuer  /  Obtenir de l’aide</text><path d="M64 843 L1536 843" fill="none" stroke="#C5D3CE" stroke-width="1.5" /><g transform="translate(64 880) scale(0.9)"><polygon points="39,0 75,21 41,44 5,22" fill="#7083DC"/><polygon points="5,22 41,44 5,66" fill="#6BC9AB"/><polygon points="5,66 41,44 41,86" fill="#E98879"/><polygon points="41,86 41,44 77,65" fill="#E5B84E"/><polygon points="77,65 41,44 75,21" fill="#47B9B5"/><polygon points="41,34 51,44 41,54 31,44" fill="#FAF9F3"/></g><text x="180" y="911" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >ESPAÑOL / LATIN</text><text x="180" y="983" fill="#102D48" font-family="OSRIInter" font-size="43" font-weight="700" text-anchor="start" >Investigación entre disciplinas,</text><text x="180" y="1038" fill="#102D48" font-family="OSRIInter" font-size="43" font-weight="700" text-anchor="start" >con un registro abierto y trazable</text><text x="180" y="1094" fill="#29485D" font-family="OSRIInter" font-size="25" font-weight="400" text-anchor="start" >Empezar a investigar  /  Contribuir  /  Obtener ayuda</text><path d="M64 1137 L1536 1137" fill="none" stroke="#C5D3CE" stroke-width="1.5" /><g transform="translate(1433 1170) scale(0.9)"><polygon points="39,0 75,21 41,44 5,22" fill="#7083DC"/><polygon points="5,22 41,44 5,66" fill="#6BC9AB"/><polygon points="5,66 41,44 41,86" fill="#E98879"/><polygon points="41,86 41,44 77,65" fill="#E5B84E"/><polygon points="77,65 41,44 75,21" fill="#47B9B5"/><polygon points="41,34 51,44 41,54 31,44" fill="#FAF9F3"/></g><text x="64" y="1204" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" ><tspan font-family="OSRIArabic">العربية</tspan><tspan dx="18">ARABIC / RTL</tspan></text><text x="1368" y="1284" fill="#102D48" font-family="OSRIArabic" font-size="46" font-weight="700" text-anchor="start" direction="rtl" unicode-bidi="plaintext">البحث عبر التخصصات لفهم الأسئلة المشتركة</text><text x="1368" y="1357" fill="#29485D" font-family="OSRIArabic" font-size="34" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext">يقود الناس البحث في ⁦<tspan font-family="OSRIInter" direction="ltr" unicode-bidi="embed">OSRI</tspan>⁩ ويقيّمون الأدلة والاستنتاجات.</text><text x="1368" y="1427" fill="#29485D" font-family="OSRIArabic" font-size="30" font-weight="400" text-anchor="start" direction="rtl" unicode-bidi="plaintext">ابدأ بسؤال، ساهم، اطلب المساعدة</text><path d="M64 1510 L1536 1510" fill="none" stroke="#C5D3CE" stroke-width="1.5" /><text x="64" y="1544" fill="#29485D" font-family="OSRIPlexMono" font-size="17" font-weight="400" text-anchor="start" >Inter: Latin. Noto Sans Arabic: Arabic. OSRI remains Latin; marks do not mirror. Draft samples; see README for the live Chinese draft.</text></svg>