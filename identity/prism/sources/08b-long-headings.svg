<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1670" viewBox="0 0 1600 1670" role="img" aria-labelledby="title desc"><title id="title">Prism long headings and script coverage</title><desc id="desc">German, Brazilian Portuguese, Hindi and Simplified Chinese draft specimens. Hindi and Chinese use dedicated Noto fonts; no localized README is claimed.</desc><style>@font-face{font-family:OSRIInter;src:url('../fonts/Inter-Regular.ttf') format('truetype');font-weight:400}@font-face{font-family:OSRIInter;src:url('../fonts/Inter-Bold.ttf') format('truetype');font-weight:700}@font-face{font-family:OSRIPlexMono;src:url('../fonts/IBMPlexMono-Regular.ttf') format('truetype');font-weight:400}@font-face{font-family:OSRIArabic;src:url('../fonts/NotoSansArabic-Regular.ttf') format('truetype');font-weight:400}@font-face{font-family:OSRIArabic;src:url('../fonts/NotoSansArabic-Bold.ttf') format('truetype');font-weight:700}text{font-kerning:normal}</style><style>@font-face{font-family:OSRIDevanagari;src:url('../../shared-language/fonts/NotoSansDevanagari-Regular.woff2')}@font-face{font-family:OSRICJK;src:url('../../shared-language/fonts/NotoSansCJKSC-Regular.woff2')}</style><rect x="0" y="0" width="1600" height="1670" rx="0" fill="#FAF9F3"/><g transform="translate(64 51) scale(0.58)"><polygon points="39,0 75,21 41,44 5,22" fill="#7083DC"/><polygon points="5,22 41,44 5,66" fill="#6BC9AB"/><polygon points="5,66 41,44 41,86" fill="#E98879"/><polygon points="41,86 41,44 77,65" fill="#E5B84E"/><polygon points="77,65 41,44 75,21" fill="#47B9B5"/><polygon points="41,34 51,44 41,54 31,44" fill="#FAF9F3"/></g><text x="127" y="82" fill="#102D48" font-family="OSRIInter" font-size="30" font-weight="700" text-anchor="start" >OSRI</text><text x="1300" y="82" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >08B / PRISM</text><path d="M64 120 L1536 120" fill="none" stroke="#C5D3CE" stroke-width="1.5" /><text x="64" y="190" fill="#102D48" font-family="OSRIInter" font-size="48" font-weight="700" text-anchor="start" >Long headings, without shortening the meaning</text><text x="64" y="249" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >DRAFT SPECIMENS / HUMAN LANGUAGE REVIEW REQUIRED</text><g transform="translate(64 296) scale(0.66)"><polygon points="39,0 75,21 41,44 5,22" fill="#7083DC"/><polygon points="5,22 41,44 5,66" fill="#6BC9AB"/><polygon points="5,66 41,44 41,86" fill="#E98879"/><polygon points="41,86 41,44 77,65" fill="#E5B84E"/><polygon points="77,65 41,44 75,21" fill="#47B9B5"/><polygon points="41,34 51,44 41,54 31,44" fill="#FAF9F3"/></g><text x="151" y="324" fill="#29485D" font-family="OSRIInter" font-size="26" font-weight="400" text-anchor="start" >Deutsch</text><text x="780" y="324" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >LATIN / INTER</text><text x="151" y="390.0" fill="#102D48" font-family="OSRIInter" font-size="42" font-weight="400" text-anchor="start" >Disziplinübergreifende offene Forschung:</text><text x="151" y="443.76" fill="#102D48" font-family="OSRIInter" font-size="42" font-weight="400" text-anchor="start" >von gemeinsamen Fragen zu</text><text x="151" y="497.52" fill="#102D48" font-family="OSRIInter" font-size="42" font-weight="400" text-anchor="start" >nachvollziehbaren Erkenntnissen</text><text x="151" y="547" fill="#29485D" font-family="OSRIInter" font-size="26" font-weight="400" text-anchor="start" >Forschung starten  /  Fragen  /  Belege  /  Erkenntnisse</text><path d="M64 586 L1536 586" fill="none" stroke="#C5D3CE" stroke-width="1.5" /><g transform="translate(64 596) scale(0.66)"><polygon points="39,0 75,21 41,44 5,22" fill="#7083DC"/><polygon points="5,22 41,44 5,66" fill="#6BC9AB"/><polygon points="5,66 41,44 41,86" fill="#E98879"/><polygon points="41,86 41,44 77,65" fill="#E5B84E"/><polygon points="77,65 41,44 75,21" fill="#47B9B5"/><polygon points="41,34 51,44 41,54 31,44" fill="#FAF9F3"/></g><text x="151" y="624" fill="#29485D" font-family="OSRIInter" font-size="26" font-weight="400" text-anchor="start" >Português do Brasil</text><text x="780" y="624" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >LATIN / INTER</text><text x="151" y="690.0" fill="#102D48" font-family="OSRIInter" font-size="42" font-weight="400" text-anchor="start" >Pesquisa aberta entre disciplinas:</text><text x="151" y="743.76" fill="#102D48" font-family="OSRIInter" font-size="42" font-weight="400" text-anchor="start" >de perguntas compartilhadas</text><text x="151" y="797.52" fill="#102D48" font-family="OSRIInter" font-size="42" font-weight="400" text-anchor="start" >a resultados documentados</text><text x="151" y="847" fill="#29485D" font-family="OSRIInter" font-size="26" font-weight="400" text-anchor="start" >Começar a pesquisar  /  Perguntas  /  Evidências  /  Resultados</text><path d="M64 886 L1536 886" fill="none" stroke="#C5D3CE" stroke-width="1.5" /><g transform="translate(64 896) scale(0.66)"><polygon points="39,0 75,21 41,44 5,22" fill="#7083DC"/><polygon points="5,22 41,44 5,66" fill="#6BC9AB"/><polygon points="5,66 41,44 41,86" fill="#E98879"/><polygon points="41,86 41,44 77,65" fill="#E5B84E"/><polygon points="77,65 41,44 75,21" fill="#47B9B5"/><polygon points="41,34 51,44 41,54 31,44" fill="#FAF9F3"/></g><text x="151" y="924" fill="#29485D" font-family="OSRIDevanagari" font-size="26" font-weight="400" text-anchor="start" >हिन्दी</text><text x="780" y="924" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >DEVANAGARI / NOTO SANS DEVANAGARI</text><text x="151" y="990.0" fill="#102D48" font-family="OSRIDevanagari" font-size="47" font-weight="400" text-anchor="start" >विभिन्न विषयों में खुला शोध:</text><text x="151" y="1050.16" fill="#102D48" font-family="OSRIDevanagari" font-size="47" font-weight="400" text-anchor="start" >साझा प्रश्नों से प्रलेखित निष्कर्षों तक</text><text x="151" y="1147" fill="#29485D" font-family="OSRIDevanagari" font-size="26" font-weight="400" text-anchor="start" >शोध शुरू करें  /  प्रश्न  /  साक्ष्य  /  निष्कर्ष</text><path d="M64 1186 L1536 1186" fill="none" stroke="#C5D3CE" stroke-width="1.5" /><g transform="translate(64 1196) scale(0.66)"><polygon points="39,0 75,21 41,44 5,22" fill="#7083DC"/><polygon points="5,22 41,44 5,66" fill="#6BC9AB"/><polygon points="5,66 41,44 41,86" fill="#E98879"/><polygon points="41,86 41,44 77,65" fill="#E5B84E"/><polygon points="77,65 41,44 75,21" fill="#47B9B5"/><polygon points="41,34 51,44 41,54 31,44" fill="#FAF9F3"/></g><text x="151" y="1224" fill="#29485D" font-family="OSRICJK" font-size="26" font-weight="400" text-anchor="start" >简体中文</text><text x="780" y="1224" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >SIMPLIFIED CHINESE / NOTO SANS CJK SC</text><text x="151" y="1290.0" fill="#102D48" font-family="OSRICJK" font-size="44" font-weight="400" text-anchor="start" >跨学科开放研究：</text><text x="151" y="1346.32" fill="#102D48" font-family="OSRICJK" font-size="44" font-weight="400" text-anchor="start" >从共同的问题到有记录的研究发现</text><text x="151" y="1447" fill="#29485D" font-family="OSRICJK" font-size="26" font-weight="400" text-anchor="start" >开始研究  /  问题  /  证据  /  研究发现</text><path d="M64 1486 L1536 1486" fill="none" stroke="#C5D3CE" stroke-width="1.5" /><path d="M64 1584 L1536 1584" fill="none" stroke="#C5D3CE" stroke-width="1.5" /><text x="64" y="1618" fill="#29485D" font-family="OSRIPlexMono" font-size="17" font-weight="400" text-anchor="start" >Latin, Devanagari, and Simplified Chinese are rendered with named local fonts; broader script coverage is not claimed.</text></svg>