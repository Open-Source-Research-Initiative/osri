<svg xmlns="http://www.w3.org/2000/svg" width="560" height="340" viewBox="0 0 560 340" role="img" aria-labelledby="title desc"><title id="title">Prism compact lockup</title><desc id="desc">Compact arrangement for a narrow column; use symbol only below 280 CSS pixels.</desc><style>@font-face{font-family:OSRIInter;src:url('../fonts/Inter-Regular.ttf') format('truetype');font-weight:400}@font-face{font-family:OSRIInter;src:url('../fonts/Inter-Bold.ttf') format('truetype');font-weight:700}@font-face{font-family:OSRIPlexMono;src:url('../fonts/IBMPlexMono-Regular.ttf') format('truetype');font-weight:400}@font-face{font-family:OSRIArabic;src:url('../fonts/NotoSansArabic-Regular.ttf') format('truetype');font-weight:400}@font-face{font-family:OSRIArabic;src:url('../fonts/NotoSansArabic-Bold.ttf') format('truetype');font-weight:700}text{font-kerning:normal}</style><defs><mask id="prism-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="82" height="90"><rect width="82" height="90" fill="white"/><polygon points="41,34 51,44 41,54 31,44" fill="black"/></mask></defs><g mask="url(#prism-cutout)" transform="translate(113 24) scale(1.55)"><polygon points="39,0 75,21 41,44 5,22" fill="#7083DC"/><polygon points="5,22 41,44 5,66" fill="#6BC9AB"/><polygon points="5,66 41,44 41,86" fill="#E98879"/><polygon points="41,86 41,44 77,65" fill="#E5B84E"/><polygon points="77,65 41,44 75,21" fill="#47B9B5"/></g><text x="270" y="121" fill="#102D48" font-family="OSRIInter" font-size="69" font-weight="700" text-anchor="start" >OSRI</text><text x="280" y="227" fill="#29485D" font-family="OSRIInter" font-size="32" font-weight="400" text-anchor="middle" >Open Source</text><text x="280" y="274" fill="#29485D" font-family="OSRIInter" font-size="32" font-weight="400" text-anchor="middle" >Research Initiative</text></svg>