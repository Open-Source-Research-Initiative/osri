<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc"><title id="title">Prism illustrative research journey</title><desc id="desc">Question, evidence, analysis, human review, writing, and publication. Dashed feedback routes return to the question, evidence and review; people authorize publication.</desc><style>@font-face{font-family:OSRIInter;src:url('../fonts/Inter-Regular.ttf') format('truetype');font-weight:400}@font-face{font-family:OSRIInter;src:url('../fonts/Inter-Bold.ttf') format('truetype');font-weight:700}@font-face{font-family:OSRIPlexMono;src:url('../fonts/IBMPlexMono-Regular.ttf') format('truetype');font-weight:400}@font-face{font-family:OSRIArabic;src:url('../fonts/NotoSansArabic-Regular.ttf') format('truetype');font-weight:400}@font-face{font-family:OSRIArabic;src:url('../fonts/NotoSansArabic-Bold.ttf') format('truetype');font-weight:700}text{font-kerning:normal}</style><rect x="0" y="0" width="1600" height="1280" rx="0" fill="#FAF9F3"/><g transform="translate(64 51) scale(0.58)"><polygon points="39,0 75,21 41,44 5,22" fill="#7083DC"/><polygon points="5,22 41,44 5,66" fill="#6BC9AB"/><polygon points="5,66 41,44 41,86" fill="#E98879"/><polygon points="41,86 41,44 77,65" fill="#E5B84E"/><polygon points="77,65 41,44 75,21" fill="#47B9B5"/><polygon points="41,34 51,44 41,54 31,44" fill="#FAF9F3"/></g><text x="127" y="82" fill="#102D48" font-family="OSRIInter" font-size="30" font-weight="700" text-anchor="start" >OSRI</text><text x="1300" y="82" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >07 / PRISM</text><path d="M64 120 L1536 120" fill="none" stroke="#C5D3CE" stroke-width="1.5" /><text x="64" y="190" fill="#102D48" font-family="OSRIInter" font-size="48" font-weight="700" text-anchor="start" >From a question, back to a question</text><rect x="64" y="236" width="1472" height="71" rx="0" fill="#102D48"/><text x="86" y="280" fill="#FAF9F3" font-family="OSRIPlexMono" font-size="21" font-weight="400" text-anchor="start" >PEOPLE</text><text x="253" y="280" fill="#FAF9F3" font-family="OSRIInter" font-size="25" font-weight="400" text-anchor="start" >Define questions · direct work · evaluate conclusions · authorize publication</text><rect x="64" y="400" width="420" height="166" rx="0" fill="#FAF9F3" stroke="#C5D3CE" stroke-width="1.5"/><polygon points="444,400 484,400 484,440" fill="#A79ADE"/><text x="88" y="437" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >01</text><text x="88" y="480" fill="#102D48" font-family="OSRIInter" font-size="34" font-weight="700" text-anchor="start" >Question</text><text x="88" y="518" fill="#29485D" font-family="OSRIInter" font-size="22" font-weight="400" text-anchor="start" >Frame a question and its scope.</text><text x="88" y="547" fill="#29485D" font-family="OSRIInter" font-size="22" font-weight="400" text-anchor="start" >People set the direction.</text><rect x="590" y="400" width="420" height="166" rx="0" fill="#FAF9F3" stroke="#C5D3CE" stroke-width="1.5"/><polygon points="970,400 1010,400 1010,440" fill="#6BC9AB"/><text x="614" y="437" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >02</text><text x="614" y="480" fill="#102D48" font-family="OSRIInter" font-size="34" font-weight="700" text-anchor="start" >Evidence</text><text x="614" y="518" fill="#29485D" font-family="OSRIInter" font-size="22" font-weight="400" text-anchor="start" >Find and appraise sources.</text><text x="614" y="547" fill="#29485D" font-family="OSRIInter" font-size="22" font-weight="400" text-anchor="start" >Record provenance and gaps.</text><rect x="1116" y="400" width="420" height="166" rx="0" fill="#FAF9F3" stroke="#C5D3CE" stroke-width="1.5"/><polygon points="1496,400 1536,400 1536,440" fill="#47B9B5"/><text x="1140" y="437" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >03</text><text x="1140" y="480" fill="#102D48" font-family="OSRIInter" font-size="34" font-weight="700" text-anchor="start" >Analysis</text><text x="1140" y="518" fill="#29485D" font-family="OSRIInter" font-size="22" font-weight="400" text-anchor="start" >Choose methods; inspect results.</text><text x="1140" y="547" fill="#29485D" font-family="OSRIInter" font-size="22" font-weight="400" text-anchor="start" >Document code and assumptions.</text><rect x="64" y="748" width="420" height="166" rx="0" fill="#FAF9F3" stroke="#C5D3CE" stroke-width="1.5"/><polygon points="444,748 484,748 484,788" fill="#E5B84E"/><text x="88" y="785" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >06</text><text x="88" y="828" fill="#102D48" font-family="OSRIInter" font-size="34" font-weight="700" text-anchor="start" >Publication</text><text x="88" y="866" fill="#29485D" font-family="OSRIInter" font-size="22" font-weight="400" text-anchor="start" >Share an authorized version.</text><text x="88" y="895" fill="#29485D" font-family="OSRIInter" font-size="22" font-weight="400" text-anchor="start" >Label output and review status.</text><rect x="590" y="748" width="420" height="166" rx="0" fill="#FAF9F3" stroke="#C5D3CE" stroke-width="1.5"/><polygon points="970,748 1010,748 1010,788" fill="#E98879"/><text x="614" y="785" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >05</text><text x="614" y="828" fill="#102D48" font-family="OSRIInter" font-size="34" font-weight="700" text-anchor="start" >Writing</text><text x="614" y="866" fill="#29485D" font-family="OSRIInter" font-size="22" font-weight="400" text-anchor="start" >Make claims traceable to evidence.</text><text x="614" y="895" fill="#29485D" font-family="OSRIInter" font-size="22" font-weight="400" text-anchor="start" >Record limits and uncertainty.</text><rect x="1116" y="748" width="420" height="166" rx="0" fill="#FAF9F3" stroke="#C5D3CE" stroke-width="1.5"/><polygon points="1496,748 1536,748 1536,788" fill="#7083DC"/><text x="1140" y="785" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >04</text><text x="1140" y="828" fill="#102D48" font-family="OSRIInter" font-size="34" font-weight="700" text-anchor="start" >Human review</text><text x="1140" y="866" fill="#29485D" font-family="OSRIInter" font-size="22" font-weight="400" text-anchor="start" >Evaluate evidence and conclusions.</text><text x="1140" y="895" fill="#29485D" font-family="OSRIInter" font-size="22" font-weight="400" text-anchor="start" >Request changes where needed.</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#102D48" stroke-width="1.6"/></marker><marker id="feedback" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#29485D" stroke-width="1.6"/></marker></defs><path d="M484 483 H583" fill="none" stroke="#102D48" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1010 483 H1109" fill="none" stroke="#102D48" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1326 566 V741" fill="none" stroke="#102D48" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1116 831 H1017" fill="none" stroke="#102D48" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M590 831 H491" fill="none" stroke="#102D48" stroke-width="2.5" marker-end="url(#arrow)"/><text x="50" y="703" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >PEOPLE AUTHORIZE SHARING</text><path d="M277 717 L277 741" fill="none" stroke="#29485D" stroke-width="1.5" /><path d="M800 400 V350 H274 V393" fill="none" stroke="#29485D" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#feedback)"/><path d="M1206 748 V620 H800 V573" fill="none" stroke="#29485D" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#feedback)"/><rect x="1198" y="681" width="16" height="18" fill="#FAF9F3"/><path d="M800 748 V690 H1260 V741" fill="none" stroke="#29485D" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#feedback)"/><path d="M274 914 V1018 H28 V483 H57" fill="none" stroke="#29485D" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#feedback)"/><text x="329" y="337" fill="#29485D" font-family="OSRIPlexMono" font-size="17" font-weight="400" text-anchor="start" >REFINE THE QUESTION</text><text x="852" y="608" fill="#29485D" font-family="OSRIPlexMono" font-size="17" font-weight="400" text-anchor="start" >SEEK MORE EVIDENCE</text><text x="846" y="676" fill="#29485D" font-family="OSRIPlexMono" font-size="17" font-weight="400" text-anchor="start" >REVIEW REVISED CLAIMS</text><text x="65" y="1046" fill="#29485D" font-family="OSRIPlexMono" font-size="17" font-weight="400" text-anchor="start" >NEW QUESTIONS / CORRECTIONS</text><rect x="64" y="1080" width="1472" height="72" rx="0" fill="#102D48"/><text x="86" y="1126" fill="#FAF9F3" font-family="OSRIPlexMono" font-size="20" font-weight="400" text-anchor="start" >GIT RECORD</text><text x="290" y="1126" fill="#FAF9F3" font-family="OSRIInter" font-size="25" font-weight="400" text-anchor="start" >Questions · sources · code · decisions · versions</text><path d="M64 1197 L1536 1197" fill="none" stroke="#C5D3CE" stroke-width="1.5" /><text x="64" y="1231" fill="#29485D" font-family="OSRIPlexMono" font-size="17" font-weight="400" text-anchor="start" >Illustrative, iterative routes. Stages can repeat or overlap; this records no completed review or publication.</text></svg>