<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" role="img" aria-labelledby="title desc"><title id="title">Prism avatar size comparison</title><desc id="desc">512, 128, 64 and 32 pixel specimens. Native exports accompany this comparison.</desc><style>@font-face{font-family:OSRIInter;src:url('../fonts/Inter-Regular.ttf') format('truetype');font-weight:400}@font-face{font-family:OSRIInter;src:url('../fonts/Inter-Bold.ttf') format('truetype');font-weight:700}@font-face{font-family:OSRIPlexMono;src:url('../fonts/IBMPlexMono-Regular.ttf') format('truetype');font-weight:400}@font-face{font-family:OSRIArabic;src:url('../fonts/NotoSansArabic-Regular.ttf') format('truetype');font-weight:400}@font-face{font-family:OSRIArabic;src:url('../fonts/NotoSansArabic-Bold.ttf') format('truetype');font-weight:700}text{font-kerning:normal}</style><rect x="0" y="0" width="1600" height="1010" rx="0" fill="#FAF9F3"/><g transform="translate(64 51) scale(0.58)"><polygon points="39,0 75,21 41,44 5,22" fill="#7083DC"/><polygon points="5,22 41,44 5,66" fill="#6BC9AB"/><polygon points="5,66 41,44 41,86" fill="#E98879"/><polygon points="41,86 41,44 77,65" fill="#E5B84E"/><polygon points="77,65 41,44 75,21" fill="#47B9B5"/><polygon points="41,34 51,44 41,54 31,44" fill="#FAF9F3"/></g><text x="127" y="82" fill="#102D48" font-family="OSRIInter" font-size="30" font-weight="700" text-anchor="start" >OSRI</text><text x="1300" y="82" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >02 / PRISM</text><path d="M64 120 L1536 120" fill="none" stroke="#C5D3CE" stroke-width="1.5" /><text x="64" y="190" fill="#102D48" font-family="OSRIInter" font-size="48" font-weight="700" text-anchor="start" >Recognizable at a glance</text><text x="64" y="255" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >ORGANIZATION AVATAR / 512 × 512</text><rect x="64" y="300" width="512" height="512" rx="0" fill="#102D48"/><g transform="translate(165 377) scale(3.7)"><polygon points="39,0 75,21 41,44 5,22" fill="#7083DC"/><polygon points="5,22 41,44 5,66" fill="#6BC9AB"/><polygon points="5,66 41,44 41,86" fill="#E98879"/><polygon points="41,86 41,44 77,65" fill="#E5B84E"/><polygon points="77,65 41,44 75,21" fill="#47B9B5"/><polygon points="41,34 51,44 41,54 31,44" fill="#102D48"/></g><text x="700" y="328" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >ACTUAL PIXEL SIZES</text><g transform="translate(700 385) scale(0.25)"><rect x="0" y="0" width="512" height="512" rx="0" fill="#102D48"/><g transform="translate(101 77) scale(3.7)"><polygon points="39,0 75,21 41,44 5,22" fill="#7083DC"/><polygon points="5,22 41,44 5,66" fill="#6BC9AB"/><polygon points="5,66 41,44 41,86" fill="#E98879"/><polygon points="41,86 41,44 77,65" fill="#E5B84E"/><polygon points="77,65 41,44 75,21" fill="#47B9B5"/><polygon points="41,34 51,44 41,54 31,44" fill="#102D48"/></g></g><text x="700" y="565" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >128 × 128</text><g transform="translate(930 385) scale(0.125)"><rect x="0" y="0" width="512" height="512" rx="0" fill="#102D48"/><g transform="translate(101 77) scale(3.7)"><polygon points="39,0 75,21 41,44 5,22" fill="#7083DC"/><polygon points="5,22 41,44 5,66" fill="#6BC9AB"/><polygon points="5,66 41,44 41,86" fill="#E98879"/><polygon points="41,86 41,44 77,65" fill="#E5B84E"/><polygon points="77,65 41,44 75,21" fill="#47B9B5"/><polygon points="41,34 51,44 41,54 31,44" fill="#102D48"/></g></g><text x="930" y="565" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >64 × 64</text><g transform="translate(1130 385) scale(0.0625)"><rect x="0" y="0" width="512" height="512" rx="0" fill="#102D48"/><g transform="translate(101 77) scale(3.7)"><polygon points="39,0 75,21 41,44 5,22" fill="#7083DC"/><polygon points="5,22 41,44 5,66" fill="#6BC9AB"/><polygon points="5,66 41,44 41,86" fill="#E98879"/><polygon points="41,86 41,44 77,65" fill="#E5B84E"/><polygon points="77,65 41,44 75,21" fill="#47B9B5"/><polygon points="41,34 51,44 41,54 31,44" fill="#102D48"/></g></g><text x="1130" y="565" fill="#29485D" font-family="OSRIPlexMono" font-size="18" font-weight="400" text-anchor="start" >32 × 32</text><text x="700" y="659" fill="#29485D" font-family="OSRIInter" font-size="28" font-weight="400" text-anchor="start" >An open center; five stable facets.</text><text x="700" y="703" fill="#29485D" font-family="OSRIInter" font-size="28" font-weight="400" text-anchor="start" >No small lettering or fragile outline.</text><text x="700" y="747" fill="#29485D" font-family="OSRIInter" font-size="28" font-weight="400" text-anchor="start" >Keep the navy ground in avatar use.</text><path d="M64 921 L1536 921" fill="none" stroke="#C5D3CE" stroke-width="1.5" /><text x="64" y="955" fill="#29485D" font-family="OSRIPlexMono" font-size="17" font-weight="400" text-anchor="start" >32 px and 64 px previews are exported at native size; no text is required.</text></svg>