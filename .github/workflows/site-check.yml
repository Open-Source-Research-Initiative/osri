name: Check public website
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r site/requirements.txt
      - name: Check that the activity board matches its registers
        run: python community/update.py --check
      - name: Build and check routes, attribution and search coverage
        run: |
          python site/build.py --output "$RUNNER_TEMP/osri-site"
          python site/check.py "$RUNNER_TEMP/osri-site"
          python site/translations.py "$RUNNER_TEMP/osri-site" --check
      - name: Check empty and multiple-project fixtures and counting rules
        run: python -m unittest discover -s site -p 'test_*.py' -v
      - name: Check catalog coverage, comparison evidence rules and output integrity
        run: python -m unittest discover -s simulation-lab -p 'test_*.py' -v
