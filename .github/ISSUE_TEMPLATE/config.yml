blank_issues_enabled: true
contact_links:
  - name: Report venue evidence or a correction
    url: https://github.com/Open-Source-Research-Initiative/free-publication-directory/issues/new?template=venue-evidence.yml
    about: Share the venue, finding, official source and check date; no code required.
  - name: Share a venue-directory use report
    url: https://github.com/Open-Source-Research-Initiative/free-publication-directory/issues/new?template=directory-use.yml
    about: Tell us whether a shortlist helped, including no-fit results.
  - name: Ask a question or request a resource
    url: https://github.com/Open-Source-Research-Initiative/.github/discussions/new?category=q-a
    about: Start with a short question. Keep confidential details out of public posts.
  - name: Propose research
    url: https://github.com/Open-Source-Research-Initiative/.github/discussions/new?category=ideas
    about: Bring an idea, source, or problem worth exploring.
